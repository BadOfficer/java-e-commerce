name: Lab 3 Grading

on:
  push:
    branches:
      - main
      - lab3
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up KinD
        uses: helm/kind-action@v1
        with:
          cluster_name: lab3

      - name: Build application image
        run: docker build -t ecommerce-app:local .

      - name: Load image into KinD
        run: kind load docker-image ecommerce-app:local --name lab3

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Run Lab 3 grading script
        run: |
          chmod +x ./tests/lab3_test.sh
          ./tests/lab3_test.sh
