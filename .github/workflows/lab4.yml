name: Lab 4 Grading

on:
  push:
    branches:
      - main
      - lab4

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Run Lab 4 grading script
        run: |
          chmod +x ./tests/lab4_test.sh
          ./tests/lab4_test.sh