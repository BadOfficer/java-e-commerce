openapi: 3.1.0
info:
  title: Order API
  description: Order API
  version: 1.0.0

paths:
  /api/v1/orders:
    post:
      summary: Add order
      tags:
        - Orders
      requestBody:
        description: User data to place order
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequestDto'
      responses:
        200:
          description: Method for adding order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDto'

        400:
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

        404:
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Get all orders
      tags:
        - Orders
      responses:
        200:
          description: List of all orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDto'

    delete:
      summary: Delete order By Id
      tags:
        - Orders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: UUID
          description: ID of the product
      responses:
        200:
          description: Deleted order
        404:
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update order status
      tags:
        - Orders
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: UUID
          description: ID of the product
        - in: query
          name: status
          required: true
          schema:
            type: enum
          description: new order status
      responses:
        200:
          description: updated status of order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponseDto"
        404:
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{id}:
    get:
      summary: Get order by Id
      tags:
        - Orders
      responses:
        200:
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseDto'
        404:
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the error type
        title:
          type: string
          description: A short description of the error
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed description of the error
    OrderRequestDto:
      type: object
      properties:
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequestDto'
          description: List of order items
        address:
          type: string
          description: Shipping address
          maxLength: 255
        email:
          type: string
          format: email
          description: Email of the consumer
        consumerName:
          type: string
          description: Name of the consumer
          maxLength: 100

    OrderItemResponseDto:
      type: object
      properties:
        productTitle:
          type: string
          description: Title of the product
        quantity:
          type: integer
          description: Quantity of the product
        price:
          type: number
          format: double
          description: Price of the product

    OrderItemRequestDto:
      type: object
      properties:
        productId:
          type: string
          description: id of the product
        quantity:
          type: integer
          description: Quantity of the product

    OrderResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the order
        consumerName:
          type: string
          description: Name of the consumer
        address:
          type: string
          description: Shipping address for the order
        email:
          type: string
          format: email
          description: Email of the consumer
        totalPrice:
          type: number
          format: double
          description: Total price of the order
        orderStatus:
          type: string
          description: Current status of the order
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemResponseDto"

    ParamsViolationDetails:
      type: object
      properties:
        fieldName:
          type: string
          description: Field where validation error occurred
        reason:
          type: string
          description: Reason for the validation error

    ValidationError:
      type: object
      properties:
        status:
          type: string
          example: '400'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ParamsViolationDetails'