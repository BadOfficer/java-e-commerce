spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: java-e-commerce
  jpa:
    hibernate:
      ddl-auto: none

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:liquibase/changelog.yaml
    enabled: true


springdoc:
  api-docs:
    path: /api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html

app:
  health:
    db-timeout-seconds: ${HEALTH_DB_TIMEOUT_SECONDS:2}

feature:
    toggles:
      cosmo-cats: true
      kitty-products: false
