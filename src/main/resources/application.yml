spring:
  application:
    name: java-e-commerce
  jpa:
    hibernate:
      ddl-auto: none

  datasource:
    url: jdbc:postgresql://localhost:5432/cosmo_cats
    username: postgres
    password: root

  liquibase:
    change-log: classpath:liquibase/changelog.yaml
    enabled: true


springdoc:
  api-docs:
    path: /api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html


feature:
    toggles:
      cosmo-cats: true
      kitty-products: false