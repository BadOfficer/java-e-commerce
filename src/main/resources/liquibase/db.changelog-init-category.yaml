databaseChangeLog:
  - changeSet:
      id: lab-3-categories
      author: taras
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)
        - createSequence:
            sequenceName: seq_category_id
            incrementBy: 50
        - addUniqueConstraint:
            tableName: category
            columnNames: title
            constraintName: uq_category_title
